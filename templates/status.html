{% extends "base.html" %}
{% block content %}
<div class="card text-center p-5">
    <div id="loading-state">
        <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;"></div>
        <h3>Restoring Virtual Machine...</h3>
        <p class="text-muted">This may take 5-10 minutes</p>
        <div class="progress mt-3 mx-auto" style="width: 60%;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
        </div>
    </div>
    
    <div id="done-state" style="display:none;">
        <i class="bi bi-check-circle-fill text-success display-1"></i>
        <h3 class="mt-3 text-success">Restore Complete!</h3>
        <p class="lead">Your VM is running</p>
        <a href="https://console.cloud.google.com/compute/instances?project={{ project }}" target="_blank" class="btn btn-primary btn-lg mt-3 me-2">View in GCP</a>
        <a href="/home" class="btn btn-outline-secondary btn-lg mt-3">New Restore</a>
    </div>
    
    <div id="error-state" style="display:none;">
        <i class="bi bi-x-octagon-fill text-danger display-1"></i>
        <h3 class="mt-3 text-danger">Restore Failed</h3>
        <p id="error-details" class="text-muted"></p>
        <a href="/home" class="btn btn-primary mt-3">Try Again</a>
    </div>
</div>

<script>
const opId = "{{ op_id }}";
const poll = setInterval(() => {
    fetch(`/api/check_status/${encodeURIComponent(opId)}`)
        .then(r => r.json())
        .then(d => {
            if(d.done) {
                clearInterval(poll);
                document.getElementById('loading-state').style.display = 'none';
                if(d.error) {
                    document.getElementById('error-state').style.display = 'block';
                    document.getElementById('error-details').innerText = JSON.stringify(d.error);
                } else {
                    document.getElementById('done-state').style.display = 'block';
                }
            }
        });
}, 5000);
</script>
{% endblock %}
