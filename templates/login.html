<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DR Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; width: 400px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-4"><i class="bi bi-shield-lock-fill text-primary"></i> DR Portal</h3>
        <div id="g_id_onload" data-client_id="{{cid}}" data-callback="handleResponse"></div>
        <div class="g_id_signin" data-type="standard" data-width="300"></div>
    </div>
    <script>function handleResponse(r){window.location.href="/callback?token="+r.credential}</script>
</body>
</html>
