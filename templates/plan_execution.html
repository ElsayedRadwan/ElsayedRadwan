{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-layers"></i> Plan Execution Status</h5>
        <span class="badge bg-primary" id="status-badge">Running...</span>
    </div>
    <div class="card-body">
        <p class="text-muted">Execution ID: {{ exec_id }}</p>
        <div id="tasks-container">
            <div class="text-center p-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Starting parallel restores...</p>
            </div>
        </div>
        <div id="done-actions" style="display:none;" class="mt-4 text-center">
            <a href="https://console.cloud.google.com/compute/instances?project={{ project }}" target="_blank" class="btn btn-primary btn-lg me-2">
                <i class="bi bi-terminal"></i> View VMs in GCP
            </a>
            <a href="/plans" class="btn btn-outline-secondary btn-lg">Back to Plans</a>
        </div>
    </div>
</div>

<script>
const execId = "{{ exec_id }}";
const container = document.getElementById('tasks-container');
const doneActions = document.getElementById('done-actions');
const statusBadge = document.getElementById('status-badge');

function renderTasks(tasks, allDone) {
    let html = '<div class="list-group">';
    tasks.forEach((t, idx) => {
        let icon = '<span class="spinner-border spinner-border-sm text-primary me-2"></span>';
        let statusClass = '';
        
        if (t.status === 'COMPLETED') {
            icon = '<i class="bi bi-check-circle-fill text-success me-2"></i>';
        } else if (t.status === 'FAILED') {
            icon = '<i class="bi bi-x-circle-fill text-danger me-2"></i>';
        }
        
        html += `
        <div class="list-group-item d-flex justify-content-between align-items-center ${statusClass}">
            <div>${icon} <strong>${t.vm_name}</strong> <small class="text-muted ms-2">Task #${idx + 1}</small></div>
            <span class="badge bg-secondary">${t.status || 'STARTING'}</span>
        </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
    
    if (allDone) {
        clearInterval(pollInterval);
        statusBadge.textContent = 'Complete';
        statusBadge.className = 'badge bg-success';
        doneActions.style.display = 'block';
    }
}

const pollInterval = setInterval(() => {
    fetch(`/api/plan_execution/${execId}`)
        .then(r => r.json())
        .then(data => renderTasks(data.tasks || [], data.all_done))
        .catch(err => console.error(err));
}, 3000);

// Initial load
fetch(`/api/plan_execution/${execId}`).then(r => r.json()).then(data => renderTasks(data.tasks || [], false));
</script>
{% endblock %}
